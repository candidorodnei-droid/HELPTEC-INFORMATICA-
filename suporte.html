<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte Remoto | Helptec Informática</title>
  <meta name="description" content="Baixe o programa de suporte remoto da Helptec Informática e veja como iniciar o atendimento à distância." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #040d1a;
      --bg-card: #0a192f;
      --primary: #0066cc;
      --accent: #00c3ff;
      --whatsapp: #25d366;
      --whatsapp-hover: #1ebe5d;
      --text-light: #ffffff;
      --text-muted: #94a3b8;
      --border-glass: rgba(0, 195, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 920px;
      margin: 0 auto;
    }

    /* HEADER WHITE */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      box-shadow: 0 4px 18px rgba(4, 13, 26, 0.14);
      z-index: 1000;
      padding: 10px 0;
    }

    .nav-wrapper {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 92px;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      background: transparent;
    }

    .brand-logo {
      height: 88px;
      width: auto;
      max-width: 500px;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 22px;
      align-items: center;
    }

    nav ul li a {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      transition: color 0.3s;
      white-space: nowrap;
    }

    nav ul li a:hover {
      color: var(--primary);
    }

    .menu-toggle {
      display: none;
      font-size: 1.75rem;
      background: none;
      border: none;
      color: #0f172a;
      cursor: pointer;
      padding: 4px 8px;
      z-index: 2;
    }

    /* CONTENT */
    main {
      padding: 168px 0 70px;
      background: radial-gradient(circle at top right, #0c2b59 0%, var(--bg-dark) 65%);
      min-height: 85vh;
    }

    .support-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      background: rgba(0, 195, 255, 0.12);
      color: var(--accent);
      border: 1px solid var(--border-glass);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    h1 span {
      color: var(--accent);
    }

    .lead {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 26px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.94rem;
      transition: all 0.3s ease;
    }

    /* BOTAO BONITO */
    .btn-primary {
      background: linear-gradient(135deg, #0066cc 0%, #00c3ff 100%);
      color: #ffffff;
      border: none;
      padding: 18px 28px;
      font-size: 1.1rem;
      box-shadow: 0 10px 25px rgba(0, 195, 255, 0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0, 195, 255, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-primary .icon-dl {
      font-size: 1.4rem;
      background: rgba(255,255,255,0.22);
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .btn-whatsapp {
      background-color: var(--whatsapp);
      color: #052e16;
    }

    .btn-whatsapp:hover {
      background-color: var(--whatsapp-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
    }

    .btn-outline:hover {
      background: rgba(0, 195, 255, 0.1);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .step-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px;
    }

    .step-num {
      display: inline-block;
      background: var(--accent);
      color: #040d1a;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .step-box h2 {
      font-size: 1rem;
      margin-bottom: 6px;
    }

      color:
