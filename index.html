    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(11, 20, 38, 0.8);
            --bg-card-hover: rgba(16, 30, 56, 0.92);
            --bg-glass: rgba(6, 13, 27, 0.72);
            --primary: #00d4ff;
            --primary-soft: rgba(0, 212, 255, 0.12);
            --primary-glow: rgba(0, 212, 255, 0.28);
            --whatsapp: #22c55e;
            --whatsapp-dark: #15803d;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-dim: #94a3b8;
            --border-color: rgba(0, 212, 255, 0.22);
            --border-subtle: rgba(148, 163, 184, 0.16);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* FUNDO COM A IMAGEM 1000737982.jpg + OVERLAY DE CONTRASTE */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(180deg, rgba(3, 7, 18, 0.78) 0%, rgba(4, 12, 28, 0.84) 48%, rgba(2, 6, 15, 0.94) 100%),
                url("1000737982.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
            will-change: transform;
        }

        /* VINHETA SUTIL PARA FOCO NO CONTEÚDO */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 18%, rgba(0, 212, 255, 0.09) 0%, transparent 62%);
            z-index: -1;
            pointer-events: none;
        }

        /* HEADER / NAVBAR */
        header {
            background: rgba(3, 8, 20, 0.84);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 13px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0284c7, #00d4ff);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #030712;
            font-size: 19px;
            box-shadow: 0 0 18px var(--primary-glow);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #ffffff;
            line-height: 1.15;
        }

        .brand-text span {
            font-size: 10.5px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .nav-links {
            display: none;
            gap: 26px;
            align-items: center;
        }

        @media (min-width: 820px) {
            .nav-links {
                display: flex;
            }
            .menu-toggle,
            .mobile-drawer {
                display: none !important;
            }
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            position: relative;
            padding: 4px 0;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));

            padding: 9px 18px;
