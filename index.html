<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helptec Informática | Assistência Técnica Especializada</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: #0b1426;
            --bg-card-hover: #101e38;
            --primary: #00d4ff;
            --primary-soft: rgba(0, 212, 255, 0.12);
            --primary-glow: rgba(0, 212, 255, 0.28);
            --whatsapp: #22c55e;
            --whatsapp-dark: #15803d;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-dim: #94a3b8;
            --border-color: rgba(0, 212, 255, 0.24);
            --border-subtle: rgba(148, 163, 184, 0.18);
            --radius-lg: 18px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(180deg, #040d1e 0%, #030712 100%);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* HEADER / NAVBAR */
        header {
            background-color: rgba(3, 8, 20, 0.94);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 13px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0284c7, #00d4ff);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #030712;
            font-size: 19px;
            box-shadow: 0 0 18px var(--primary-glow);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #ffffff;
            line-height: 1.15;
        }

        .brand-text span {
            font-size: 10.5px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .nav-links {
            display: none;
            gap: 26px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            padding: 4px 0;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav-zap {
            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
            color: #ffffff;
            padding: 9px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        .btn-nav-zap:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(34, 197, 94, 0.5);
        }

        .menu-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-subtle);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .menu-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mobile-drawer {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 12px 20px 18px;
            background-color: #030814;
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-drawer.open {
            display: flex;
        }

        .mobile-drawer a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .mobile-drawer a:hover {
            background-color: var(--primary-soft);
            color: #ffffff;
        }

        /* BANNER PRINCIPAL DO CABEÇALHO */
        .hero-banner-wrapper {
            max-width: 1160px;
            margin: 24px auto 0;
            padding: 0 20px;
        }

        .hero-banner {
            position: relative;
            width: 100%;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 212, 255, 0.14);
            background-color: #041226;
        }

        .hero-banner img {
            width: 100%;
            height: auto;
            max-height: 430px;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* HERO CTA SECTION LOGO ABAIXO DO BANNER */
        .hero {
            padding: 28px 20px 64px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .hero-container {
            max-width: 1120px;
            margin: 0 auto;
            background: linear-gradient(180deg, #0b1426 0%, #060d1b 100%);
            border: 1px solid rgba(0, 212, 255, 0.24);
            border-radius: 22px;
            padding: 38px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

            display: inline-flex;
            align-items: center;
            gap: 8px
