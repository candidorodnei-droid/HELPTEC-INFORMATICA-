<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helptec Informática | Assistência Técnica Especializada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(11, 20, 38, 0.78);
            --bg-card-hover: rgba(16, 30, 56, 0.9);
            --bg-glass: rgba(6, 13, 27, 0.72);
            --primary: #00d4ff;
            --primary-soft: rgba(0, 212, 255, 0.12);
            --primary-glow: rgba(0, 212, 255, 0.28);
            --whatsapp: #22c55e;
            --whatsapp-dark: #15803d;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-dim: #94a3b8;
            --border-color: rgba(0, 212, 255, 0.22);
            --border-subtle: rgba(148, 163, 184, 0.16);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* FUNDO COM A IMAGEM 1000737982.jpg + OVERLAY DE CONTRASTE */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(180deg, rgba(3, 7, 18, 0.76) 0%, rgba(4, 12, 28, 0.82) 48%, rgba(2, 6, 15, 0.92) 100%),
                url("1000737982.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
        }

        /* VINHETA SUTIL PARA FOCO NO CONTEÚDO */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 18%, rgba(0, 212, 255, 0.08) 0%, transparent 62%);
            z-index: -1;
            pointer-events: none;
        }

        /* HEADER / NAVBAR */
        header {
            background: rgba(3, 8, 20, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 13px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0284c7, #00d4ff);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #030712;
            font-size: 19px;
            box-shadow: 0 0 18px var(--primary-glow);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #ffffff;
            line-height: 1.15;
        }

        .brand-text span {
            font-size: 10.5px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .nav-links {
            display: none;
            gap: 26px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            position: relative;
            padding: 4px 0;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav-zap {
            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
            color: #ffffff;
            padding: 9px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-nav-zap:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(34, 197, 94, 0.5);
        }

        .menu-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
        }

        .menu-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mobile-drawer {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 12px 20px 18px;
            background: rgba(3, 8, 20, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-drawer.open {
            display: flex;
        }

        .mobile-drawer a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
        }

        .mobile-drawer a:hover {
            background: var(--primary-soft);
            color: #ffffff;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            padding: 84px 20px 76px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .hero-container {
            max-width: 840px;
            margin: 0 auto;
            background: rgba(4, 11, 24, 0.56);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.18);
            border-radius: 24px;
            padding: 44px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.38);
