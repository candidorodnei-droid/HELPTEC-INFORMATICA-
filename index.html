<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helptec Informática | Assistência Técnica Especializada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(11, 20, 38, 0.78);
            --bg-card-hover: rgba(16, 30, 56, 0.9);
            --bg-glass: rgba(6, 13, 27, 0.72);
            --primary: #00d4ff;
            --primary-soft: rgba(0, 212, 255, 0.12);
            --primary-glow: rgba(0, 212, 255, 0.28);
            --whatsapp: #22c55e;
            --whatsapp-dark: #15803d;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --text-dim: #94a3b8;
            --border-color: rgba(0, 212, 255, 0.22);
            --border-subtle: rgba(148, 163, 184, 0.16);
            --radius-lg: 18px;
            --radius-md: 12px;
            --transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.65;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* FUNDO COM A IMAGEM 1000737982.jpg + OVERLAY DE CONTRASTE */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(180deg, rgba(3, 7, 18, 0.76) 0%, rgba(4, 12, 28, 0.82) 48%, rgba(2, 6, 15, 0.92) 100%),
                url("1000737982.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
        }

        /* VINHETA SUTIL PARA FOCO NO CONTEÚDO */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 18%, rgba(0, 212, 255, 0.08) 0%, transparent 62%);
            z-index: -1;
            pointer-events: none;
        }

        /* HEADER / NAVBAR */
        header {
            background: rgba(3, 8, 20, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1160px;
            margin: 0 auto;
            padding: 13px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #0284c7, #00d4ff);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #030712;
            font-size: 19px;
            box-shadow: 0 0 18px var(--primary-glow);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 16.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: #ffffff;
            line-height: 1.15;
        }

        .brand-text span {
            font-size: 10.5px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .nav-links {
            display: none;
            gap: 26px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            position: relative;
            padding: 4px 0;
            transition: var(--transition);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.25s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav-zap {
            background: linear-gradient(135deg, var(--whatsapp), var(--whatsapp-dark));
            color: #ffffff;
            padding: 9px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-nav-zap:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(34, 197, 94, 0.5);
        }

        .menu-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
        }

        .menu-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .mobile-drawer {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding: 12px 20px 18px;
            background: rgba(3, 8, 20, 0.95);
            border-bottom: 1px solid var(--border-color);
        }

        .mobile-drawer.open {
            display: flex;
        }

        .mobile-drawer a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
        }

        .mobile-drawer a:hover {
            background: var(--primary-soft);
            color: #ffffff;
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            padding: 84px 20px 76px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .hero-container {
            max-width: 840px;
            margin: 0 auto;
            background: rgba(4, 11, 24, 0.56);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.18);
            border-radius: 24px;
            padding: 44px 26px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 212, 255, 0.12);
            border: 1px solid rgba(0, 212, 255, 0.38);
            color: #7dd3fc;
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 22px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--whatsapp);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--whatsapp);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.7; }
        }

        .hero h2 {
            font-size: clamp(28px, 4.8vw, 44px);
            font-weight: 800;
            line-height: 1.16;
            letter-spacing: -0.02em;
            margin-bottom: 18px;
            color: #ffffff;
        }

        .hero h2 span {
            background: linear-gradient(90deg, #00d4ff, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(15px, 1.9vw, 17px);
            color: var(--text-muted);
            margin-bottom: 32px;
            max-width: 630px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #25d366, #15803d);
            color: #ffffff;
            padding: 15px 28px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            box-shadow: 0 10px 26px rgba(37, 211, 102, 0.32);
            transition: var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(37, 211, 102, 0.45);
        }

        .btn-secondary {
            background: rgba(11, 20, 38, 0.85);
            border: 1px solid rgba(0, 212, 255, 0.45);
            color: #e0f2fe;
            padding: 15px 28px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.16);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* METRICS / HIGHLIGHTS */
        .highlights {
            max-width: 1160px;
            margin: -30px auto 0;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 16px;
        }

        .highlight-box {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.42);
            transition: var(--transition);
        }

        .highlight-box:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 212, 255, 0.45);
        }

        .highlight-icon {
            width: 46px;
            height: 46px;
            background: var(--primary-soft);
            border: 1px solid rgba(0, 212, 255, 0.25);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .highlight-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .highlight-info p {
            font-size: 12.5px;
            color: var(--text-dim);
        }

        /* SECTIONS COMMON */
        section {
            max-width: 1160px;
            margin: 0 auto;
            padding: 72px 20px 12px;
        }

        .section-header {
            text-align: center;
            margin-bottom: 42px;
        }

        .section-tag {
            color: var(--primary);
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.6px;
            display: inline-block;
            background: rgba(0, 212, 255, 0.08);
            border: 1px solid rgba(0, 212, 255, 0.22);
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .section-header h3 {
            font-size: clamp(24px, 3.4vw, 33px);
            font-weight: 800;
            letter-spacing: -0.015em;
            color: #ffffff;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 14.5px;
            max-width: 570px;
            margin: 10px auto 0;
        }

        /* SERVICES GRID */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            transition: var(--transition);
        }

        .service-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: var(--bg-card-hover);
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.48);
        }

        .service-top {
            margin-bottom: 22px;
        }

        .service-badge-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-soft);
            border: 1px solid rgba(0, 212, 255, 0.28);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 16px;
        }

        .service-card h4 {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .service-card p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .btn-service {
            display: block;
            text-align: center;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.35);
            color: #7dd3fc;
            padding: 11px 14px;
            border-radius: 11px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-service:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #030712;
        }

        /* HOW IT WORKS */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(265px, 1fr));
            gap: 20px;
        }

        .step-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 26px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            transition: var(--transition);
        }

        .step-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-3px);
        }

        .step-number {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            opacity: 0.75;
            margin-bottom: 10px;
            line-height: 1;
        }

        .step-card h4 {
            font-size: 16.5px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .step-card p {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        /* ABOUT & SPACE TWO-COLUMN */
        .two-col-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 24px;
        }

        .panel-card {
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
        }

        .tech-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            background: rgba(3, 8, 20, 0.65);
            padding: 14px 16px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .tech-photo {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 2px solid var(--primary);
            box-shadow: 0 0 18px var(--primary-glow);
            flex-shrink: 0;
        }

        .tech-header h4 {
            font-size: 18px;
